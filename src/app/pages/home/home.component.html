<div class="menu-container">
    <mat-card class="menu-card" *ngFor="let item of menuItems" [routerLink]="item.link">
      <mat-card-header>
        <mat-icon>{{ item.icon }}</mat-icon>
        <mat-card-title>{{ item.name }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{ item.description }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" [routerLink]="item.link">Ir a {{ item.name }}</button>
      </mat-card-actions>
    </mat-card>
  </div>
